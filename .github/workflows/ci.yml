name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      greeting:
        description: "수동 실행 때 전달할 인사말"
        default: "기본 인사말"

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: 인사하기
        run: echo "Hello from GitHub Actions!"

      - name: 트리거 종류와 입력값 보기
        run: |
          echo "트리거 종류: ${{ github.event_name }}"
          echo "입력받은 인사말: ${{ inputs.greeting }}"

      - name: 러너 정보 보기
        run: |
          echo "이 스크립트는 깃헙이 빌려준 가상머신에서 실행 중"
          whoami
          uname -a
          pwd

      - name: 트리거 정보 보기
        run: |
          echo "트리거한 사람: ${{ github.actor }}"
          echo "커밋: ${{ github.sha }}"
          echo "브랜치: ${{ github.ref_name }}"

      - name: 시작 시각과 호스트명
        run: |
          date -u +"시작: %H:%M:%S"
          hostname

  second:
    runs-on: ubuntu-latest
    steps:
      - name: 나는 별도 VM에서 동시에 실행
        run: |
          date -u +"시작: %H:%M:%S"
          hostname
          echo "hello 잡을 기다리지 않고 바로 시작했음"
